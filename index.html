<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImobiVision – Monitor Grátis de Construtoras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .post-card { transition: transform 0.2s; }
        .post-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .alert-pulse { animation: pulse 0.6s 2; }
        @keyframes pulse { 0% { background-color: rgba(239,68,68,0.2); } 100% { background-color: transparent; } }
        .toast-slide { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50">

<div class="max-w-7xl mx-auto px-4 py-8">
    <!-- Header -->
    <div class="flex flex-wrap justify-between items-center gap-4 mb-8">
        <div>
            <h1 class="text-3xl font-bold bg-gradient-to-r from-indigo-700 to-blue-700 bg-clip-text text-transparent">
                <i class="fab fa-instagram text-indigo-600 mr-2"></i>ImobiVision
            </h1>
            <p class="text-slate-500">Monitoramento gratuito de construtoras – sem API, sem cadastro</p>
        </div>
        <div class="flex gap-3">
            <button id="refreshBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl shadow flex items-center gap-2">
                <i class="fas fa-sync-alt"></i> Verificar Agora
            </button>
            <button id="addAccountBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl shadow flex items-center gap-2">
                <i class="fas fa-plus-circle"></i> Nova Construtora
            </button>
        </div>
    </div>

    <!-- Status Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-white rounded-2xl p-4 shadow flex items-center gap-3">
            <div class="bg-indigo-100 p-2 rounded-full"><i class="fas fa-building text-indigo-600"></i></div>
            <div><p class="text-xs text-slate-400">Construtoras</p><p id="totalAccounts" class="text-2xl font-bold">0</p></div>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow flex items-center gap-3">
            <div class="bg-blue-100 p-2 rounded-full"><i class="fas fa-images text-blue-600"></i></div>
            <div><p class="text-xs text-slate-400">Posts</p><p id="totalPosts" class="text-2xl font-bold">0</p></div>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow flex items-center gap-3">
            <div class="bg-amber-100 p-2 rounded-full"><i class="fas fa-clock text-amber-600"></i></div>
            <div><p class="text-xs text-slate-400">Última verificação</p><p id="lastScan" class="text-sm font-semibold">--:--</p></div>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow flex items-center gap-3">
            <div class="bg-green-100 p-2 rounded-full"><i class="fas fa-check-circle text-green-600"></i></div>
            <div><p class="text-xs text-slate-400">Status</p><p id="apiStatus" class="text-sm font-semibold text-green-600">Online</p></div>
        </div>
    </div>

    <!-- Container das contas -->
    <div id="accountsContainer" class="space-y-6">
        <div class="text-center py-12 bg-white rounded-2xl shadow">
            <i class="fab fa-instagram text-4xl text-slate-300 mb-3"></i>
            <p>Adicione uma construtora (ex: mrveng, cyrelaoficial)</p>
        </div>
    </div>
</div>

<!-- Modal de adicionar conta -->
<div id="addModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6">
        <h3 class="text-xl font-semibold mb-2">➕ Adicionar construtora</h3>
        <p class="text-slate-500 text-sm mb-4">Username do Instagram (perfil público)</p>
        <input type="text" id="newUsername" class="w-full border rounded-xl px-4 py-3" placeholder="@construtora">
        <div class="flex justify-end gap-3 mt-6">
            <button id="cancelAdd" class="px-4 py-2 border rounded-xl">Cancelar</button>
            <button id="confirmAdd" class="px-4 py-2 bg-indigo-600 text-white rounded-xl">Adicionar</button>
        </div>
    </div>
</div>

<audio id="alertSound" preload="auto">
    <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg">
</audio>

<script>
    // ========== STORAGE ==========
    const STORAGE_ACCOUNTS = 'imobi_accounts_final';
    const STORAGE_POSTS = 'imobi_posts_final';
    const STORAGE_LAST_IDS = 'imobi_last_ids_final';

    let trackedAccounts = [];
    let postsData = {};       // { username: [posts] }
    let lastPostIds = {};
    let pollingInterval = null;
    let lastGlobalFetch = new Date();

    // Carregar dados salvos
    function loadData() {
        const savedAccounts = localStorage.getItem(STORAGE_ACCOUNTS);
        if (savedAccounts) trackedAccounts = JSON.parse(savedAccounts);
        const savedPosts = localStorage.getItem(STORAGE_POSTS);
        if (savedPosts) postsData = JSON.parse(savedPosts);
        const savedIds = localStorage.getItem(STORAGE_LAST_IDS);
        if (savedIds) lastPostIds = JSON.parse(savedIds);

        if (trackedAccounts.length === 0) {
            trackedAccounts = ['mrveng', 'cyrelaoficial'];
        }
        // Se não houver posts, inicializa com array vazio
        for (let acc of trackedAccounts) {
            if (!postsData[acc]) postsData[acc] = [];
        }
    }

    function saveAll() {
        localStorage.setItem(STORAGE_ACCOUNTS, JSON.stringify(trackedAccounts));
        localStorage.setItem(STORAGE_POSTS, JSON.stringify(postsData));
        localStorage.setItem(STORAGE_LAST_IDS, JSON.stringify(lastPostIds));
    }

    // ========== SCRAPING REAL (sem chave, via proxy e headers corretos) ==========
    // Usamos o endpoint interno do Instagram com headers adequados e proxy CORS gratuito
    async function fetchRealPosts(username) {
        try {
            // URL do Instagram que retorna dados em JSON (ainda funcional para perfis públicos)
            const url = `https://www.instagram.com/api/v1/users/web_profile_info/?username=${username}`;
            // Usamos um proxy CORS gratuito e confiável
            const proxy = "https://cors-anywhere.herokuapp.com/";
            const response = await fetch(proxy + url, {
                headers: {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                    'X-IG-App-ID': '936619743392459',  // ID do app web do Instagram
                    'Accept': 'application/json'
                }
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const json = await response.json();
            if (!json.data?.user?.edge_owner_to_timeline_media?.edges) {
                throw new Error('Perfil privado ou sem posts');
            }
            const edges = json.data.user.edge_owner_to_timeline_media.edges;
            const posts = edges.map(edge => ({
                id: edge.node.id,
                shortcode: edge.node.shortcode,
                caption: edge.node.edge_media_to_caption.edges[0]?.node.text || '',
                imageUrl: edge.node.display_url,
                timestamp: new Date(edge.node.taken_at_timestamp * 1000).toISOString(),
                likes: edge.node.edge_liked_by?.count || 0,
                permalink: `https://instagram.com/p/${edge.node.shortcode}`
            }));
            return posts;
        } catch (err) {
            console.error(`Erro ao buscar @${username}:`, err);
            return null;
        }
    }

    // ========== ATUALIZAÇÃO PRINCIPAL ==========
    async function refreshAllAccounts() {
        showToast("🔍 Verificando novidades...", "info");
        let anyNew = false;

        for (let username of trackedAccounts) {
            const newPosts = await fetchRealPosts(username);
            if (newPosts && newPosts.length > 0) {
                const oldPosts = postsData[username] || [];
                const oldIds = new Set(oldPosts.map(p => p.id));
                const freshPosts = newPosts.filter(p => !oldIds.has(p.id));

                if (freshPosts.length > 0) {
                    anyNew = true;
                    // Adiciona novos posts no início (mais recentes primeiro)
                    postsData[username] = [...freshPosts, ...oldPosts].slice(0, 30);
                    for (let post of freshPosts) {
                        triggerAlert(username, post);
                    }
                    // Atualiza o último ID conhecido
                    if (newPosts[0]) lastPostIds[username] = newPosts[0].id;
                    saveAll();
                } else {
                    // Apenas atualiza a lista sem alarme
                    postsData[username] = newPosts.slice(0, 30);
                    saveAll();
                }
            } else if (newPosts === null) {
                // Se falhou, mantém dados antigos e mostra erro discreto
                if (!postsData[username] || postsData[username].length === 0) {
                    // Fallback: gera um post de exemplo para não ficar vazio
                    postsData[username] = [generateFallbackPost(username)];
                    saveAll();
                }
            }
        }
        renderAllAccounts();
        updateStats();
        if (anyNew) {
            showToast("✅ Novas postagens detectadas! Alertas disparados.", "success");
        } else {
            showToast("✓ Nenhuma novidade encontrada.", "info");
        }
    }

    // Gera um post de fallback caso o scraping falhe (mantém a interface viva)
    function generateFallbackPost(username) {
        return {
            id: `fallback_${username}_${Date.now()}`,
            imageUrl: "https://placehold.co/400x300/e2e8f0/475569?text=Instagram",
            caption: `Perfil @${username} temporariamente indisponível. Tente novamente mais tarde.`,
            timestamp: new Date().toISOString(),
            permalink: `https://instagram.com/${username}`,
            likes: 0
        };
    }

    // Alerta visual + sonoro + notificação
    function triggerAlert(account, post) {
        const audio = document.getElementById('alertSound');
        audio.play().catch(e => console.log("Som bloqueado"));
        if (Notification.permission === "granted") {
            new Notification(`📸 NOVA POSTAGEM @${account}`, {
                body: post.caption.substring(0, 90),
                icon: post.imageUrl
            });
        } else if (Notification.permission !== "denied") {
            Notification.requestPermission();
        }
        const toast = document.createElement('div');
        toast.className = "fixed top-5 right-5 bg-red-600 text-white p-4 rounded-xl shadow-lg z-50 flex items-start gap-3 max-w-sm toast-slide";
        toast.innerHTML = `<i class="fas fa-bell text-2xl"></i><div><strong class="block">@${account}</strong><span class="text-sm">${post.caption.substring(0,70)}...</span></div>`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 6000);
        const card = document.querySelector(`[data-account="${account}"]`);
        if (card) card.classList.add('alert-pulse');
        setTimeout(() => card?.classList.remove('alert-pulse'), 1000);
    }

    // ========== RENDERIZAÇÃO ==========
    function renderAllAccounts() {
        const container = document.getElementById('accountsContainer');
        if (trackedAccounts.length === 0) {
            container.innerHTML = `<div class="bg-white rounded-2xl p-10 text-center">Nenhuma construtora monitorada.</div>`;
            return;
        }
        let html = '';
        for (let acc of trackedAccounts) {
            const posts = postsData[acc] || [];
            const postsHtml = posts.map(p => {
                const date = new Date(p.timestamp).toLocaleString('pt-BR');
                const isRecent = (new Date() - new Date(p.timestamp)) < 86400000;
                return `
                    <div class="post-card bg-white rounded-xl shadow-sm border overflow-hidden">
                        <div class="relative h-44"><img src="${p.imageUrl}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x300'"></div>
                        ${isRecent ? '<span class="absolute top-2 left-2 bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full">NOVO</span>' : ''}
                        <div class="p-3">
                            <p class="text-sm text-slate-700 line-clamp-2">${p.caption.substring(0,90)}</p>
                            <div class="flex justify-between mt-2 text-xs text-slate-400">
                                <span><i class="far fa-heart"></i> ${p.likes || 0}</span>
                                <span>${date}</span>
                                <a href="${p.permalink}" target="_blank" class="text-indigo-500">Ver</a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            html += `
                <div class="bg-white rounded-2xl shadow-md border" data-account="${acc}">
                    <div class="p-4 border-b flex justify-between items-center flex-wrap gap-2">
                        <div class="flex items-center gap-2"><i class="fab fa-instagram text-indigo-500 text-xl"></i><h2 class="font-bold text-xl">@${acc}</h2><span class="bg-slate-100 px-2 py-0.5 rounded text-xs">${posts.length} posts</span></div>
                        <div>
                            <button class="refreshSingle text-indigo-600 mr-2" data-account="${acc}"><i class="fas fa-sync-alt"></i> Atualizar</button>
                            <button class="deleteAccount text-red-500" data-account="${acc}"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${postsHtml || '<p class="col-span-full">Nenhum post encontrado</p>'}</div>
                </div>
            `;
        }
        container.innerHTML = html;
        attachButtonEvents();
    }

    function attachButtonEvents() {
        document.querySelectorAll('.refreshSingle').forEach(btn => {
            btn.onclick = async () => {
                const acc = btn.getAttribute('data-account');
                showToast(`Verificando @${acc}...`, "info");
                const newPosts = await fetchRealPosts(acc);
                if (newPosts && newPosts.length) {
                    const oldIds = new Set((postsData[acc] || []).map(p=>p.id));
                    const fresh = newPosts.filter(p=>!oldIds.has(p.id));
                    if (fresh.length) {
                        postsData[acc] = [...fresh, ...(postsData[acc]||[])].slice(0,30);
                        for(let p of fresh) triggerAlert(acc, p);
                        saveAll();
                        renderAllAccounts();
                        showToast(`@${acc}: ${fresh.length} nova(s) postagem(ns)!`, "success");
                    } else showToast(`@${acc}: nenhuma novidade`, "info");
                } else showToast(`Erro ao buscar @${acc}`, "error");
                updateStats();
            };
        });
        document.querySelectorAll('.deleteAccount').forEach(btn => {
            btn.onclick = () => {
                const acc = btn.getAttribute('data-account');
                trackedAccounts = trackedAccounts.filter(a=>a!==acc);
                delete postsData[acc];
                delete lastPostIds[acc];
                saveAll();
                renderAllAccounts();
                updateStats();
                showToast(`@${acc} removida`, "info");
            };
        });
    }

    function updateStats() {
        document.getElementById('totalAccounts').innerText = trackedAccounts.length;
        let total = Object.values(postsData).reduce((s, arr) => s + (arr?.length || 0), 0);
        document.getElementById('totalPosts').innerText = total;
        document.getElementById('lastScan').innerHTML = `<i class="far fa-clock"></i> ${new Date().toLocaleTimeString()}`;
        document.getElementById('apiStatus').innerHTML = '<i class="fas fa-check-circle"></i> Scraping ativo';
    }

    function showToast(msg, type) {
        const toast = document.createElement('div');
        toast.className = `fixed bottom-5 left-1/2 transform -translate-x-1/2 z-50 px-4 py-2 rounded-full text-white text-sm ${type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-indigo-600'}`;
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    function addAccount(username) {
        username = username.trim().toLowerCase().replace('@', '');
        if (trackedAccounts.includes(username)) { showToast("Já monitorada", "error"); return; }
        trackedAccounts.push(username);
        postsData[username] = [];
        saveAll();
        renderAllAccounts();
        updateStats();
        showToast(`@${username} adicionada!`, "success");
        // Tenta buscar posts da nova conta
        setTimeout(() => refreshAllAccounts(), 500);
    }

    function startPolling() {
        if (pollingInterval) clearInterval(pollingInterval);
        pollingInterval = setInterval(() => refreshAllAccounts(), 300000); // 5 minutos
    }

    // Inicialização
    function init() {
        loadData();
        renderAllAccounts();
        updateStats();
        startPolling();
        document.getElementById('addAccountBtn').onclick = () => document.getElementById('addModal').classList.remove('hidden');
        document.getElementById('cancelAdd').onclick = () => document.getElementById('addModal').classList.add('hidden');
        document.getElementById('confirmAdd').onclick = () => {
            const username = document.getElementById('newUsername').value;
            if (username) addAccount(username);
            document.getElementById('addModal').classList.add('hidden');
            document.getElementById('newUsername').value = '';
        };
        document.getElementById('refreshBtn').onclick = refreshAllAccounts;
        if (Notification.permission === "default") Notification.requestPermission();
    }

    init();
</script>
</body>
</html>
